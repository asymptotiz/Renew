<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centered Newsletter Image</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #e2e2e2; /* Light gray background */
      display: flex;
      justify-content: center;
    }
    .image-container {
      max-width: 680px;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="image-container">
    <a href="Renew May Recruitment Newsletter 1.html">
      <img src="Renew May Recruitment Newsletter 2.jpg" alt="Renew Newsletter">
    </a>
  </div>
</body>
</html>
